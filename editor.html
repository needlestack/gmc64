<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gmc64 — redirecting to program editor</title>
<!--
    editor.html is preserved as a redirect stub after the v1.0 rename to
    program-editor.html — bookmarks, iframe embeds, and shared links
    (like `?play_demo=1` alias URLs) all keep working. Query string and
    hash are forwarded verbatim so the target sees the same URL.
    Meta-refresh is the fallback for the rare browser with JS disabled;
    the JS path fires first and uses replace() so back-button skips the
    stub instead of bouncing between the two.
-->
<meta http-equiv="refresh" content="0; url=program-editor.html">
<script>
    location.replace('program-editor.html' + location.search + location.hash);
</script>
</head>
<body>
    Redirecting to <a href="program-editor.html">program-editor.html</a>…
</body>
</html>
